      <circle cx="160" cy="175" r="14" />
      <circle cx="208" cy="175" r="14" />
      <circle cx="256" cy="175" r="14" />
      <circle cx="304" cy="175" r="14" />
      <circle cx="352" cy="175" r="14" />
    </g>

    <!-- Decorative Mint Leaf (Minimalist accent) -->
    <path d="M340 145 C350 120, 380 120, 380 145 C380 170, 350 160, 340 145 Z" fill="#4E7055" />
    <path d="M340 145 C325 130, 325 100, 340 100 C355 100, 350 130, 340 145 Z" fill="#6A8E73" />
