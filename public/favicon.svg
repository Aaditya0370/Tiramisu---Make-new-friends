<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- White Background -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Minimalist Tiramisu Icon -->
  <g transform="translate(0, 20)">
    <!-- Bottom Layer (Ladyfingers/Cake) -->
    <path d="M136 340 H376 V380 H136 Z" fill="#C68B59" rx="8" />

    <!-- Middle Mascarpone Cream Layer -->
    <path d="M136 290 H376 V330 H136 Z" fill="#FFF5E4" rx="4" />

    <!-- Top Layer (Ladyfingers/Espresso Cake) -->
    <path d="M136 240 H376 V280 H136 Z" fill="#A0522D" rx="8" />

